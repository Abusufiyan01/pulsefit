  docker-build:
    runs-on: ubuntu-latest
    needs: [server-tests, client-build]
    strategy:
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.service }} image
        run: docker build -t pulsefit-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
      - name: Show image size
        run: docker images pulsefit-${{ matrix.service }}
      # Pinned to a full commit SHA on purpose: tags can be moved by an attacker, SHAs cannot.
      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsefit-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'